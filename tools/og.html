<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{--paper:#fbf6ec;--paper-2:#efe4cf;background-color:var(--paper-2);
background-image:
radial-gradient(circle at 100% 150%, var(--paper-2) 24%, var(--paper) 24%, var(--paper) 28%, var(--paper-2) 28%, var(--paper-2) 36%, var(--paper) 36%, var(--paper) 40%, transparent 40%, transparent),
radial-gradient(circle at 0 150%, var(--paper-2) 24%, var(--paper) 24%, var(--paper) 28%, var(--paper-2) 28%, var(--paper-2) 36%, var(--paper) 36%, var(--paper) 40%, transparent 40%, transparent),
radial-gradient(circle at 50% 100%, var(--paper) 10%, var(--paper-2) 10%, var(--paper-2) 23%, var(--paper) 23%, var(--paper) 30%, var(--paper-2) 30%, var(--paper-2) 43%, var(--paper) 43%, var(--paper) 50%, var(--paper-2) 50%, var(--paper-2) 63%, var(--paper) 63%, var(--paper) 71%, transparent 71%, transparent),
radial-gradient(circle at 100% 50%, var(--paper) 5%, var(--paper-2) 5%, var(--paper-2) 15%, var(--paper) 15%, var(--paper) 20%, var(--paper-2) 20%, var(--paper-2) 29%, var(--paper) 29%, var(--paper) 34%, var(--paper-2) 34%, var(--paper-2) 44%, var(--paper) 44%, var(--paper) 49%, transparent 49%, transparent),
radial-gradient(circle at 0 50%, var(--paper) 5%, var(--paper-2) 5%, var(--paper-2) 15%, var(--paper) 15%, var(--paper) 20%, var(--paper-2) 20%, var(--paper-2) 29%, var(--paper) 29%, var(--paper) 34%, var(--paper-2) 34%, var(--paper-2) 44%, var(--paper) 44%, var(--paper) 49%, transparent 49%, transparent);
background-size:64px 32px;display:flex;align-items:flex-start;justify-content:center;gap:56px;padding-top:60px;box-sizing:border-box}
.phone{width:260px;padding:9px;border-radius:44px;background:#22263a;box-shadow:0 24px 48px -18px rgba(38,56,106,.5),0 6px 14px rgba(43,42,51,.15)}
.phone img{display:block;width:100%;border-radius:35px}
.a{transform:rotate(-5deg) translateY(40px)}.b{transform:translateY(0)}.c{transform:rotate(5deg) translateY(40px)}
</style></head><body>
<div class="phone a"><img src="../public/img/shelf.webp"></div>
<div class="phone b"><img src="../public/img/book-page.webp"></div>
<div class="phone c"><img src="../public/img/unlock-screen.webp"></div>
</body></html>
